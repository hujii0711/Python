# Qdrant 서버 모드용. Docker Desktop 설치 후 사용.
#   docker compose up -d      # 실행
#   docker compose down       # 종료
# 대시보드: http://localhost:6333/dashboard
services:
  qdrant:
    # qdrant-client 와 버전을 맞춘다. linux/amd64 + linux/arm64 멀티아치 이미지라
    # Apple Silicon 맥에서도 에뮬레이션 없이 네이티브로 돈다.
    image: qdrant/qdrant:v1.19.1
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST / 대시보드
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ""
